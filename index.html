<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Tatjana Portal</title>

<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">



<style>
:root {
  --app-vh: 1vh;
  --primary: #10b981;
  --primary-hover: #059669;
  --secondary: #8b5cf6;
  --bg-main: #f5f5f7;
  --bg-chat: #ffffff;
  --bg-user: #ffffff;
  --bg-assistant: #e9d5ff;
  --text-main: #1f2937;
  --text-dim: #6b7280;
  --border: #e5e7eb;
  --danger: #b91c1c;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  height: 100vh;
  height: 100dvh;
  height: calc(var(--app-vh, 1vh) * 100);
  min-height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  height: 100vh;
  height: 100dvh;
  height: calc(var(--app-vh, 1vh) * 100);
  min-height: 100dvh;
  overflow: hidden;
}

/* Sidebar */
#sidebar {
  width: 280px;
  background: var(--bg-chat);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  height: 100dvh;
  height: calc(var(--app-vh, 1vh) * 100);
  min-height: 100dvh;
  z-index: 1000;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#sidebar.open {
  transform: translateX(0);
}

#sidebar-header {
  padding: 18px 14px 10px;
  padding-top: calc(18px + env(safe-area-inset-top));
  padding-left: calc(14px + env(safe-area-inset-left));
  padding-right: calc(14px + env(safe-area-inset-right));
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#sidebar-header h3 {
  margin: 0;
  font-size: 22px;
  font-weight: 750;
  letter-spacing: 0;
}

.sidebar-header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

#sidebar-close,
#sidebar-search-toggle,
#sidebar-settings-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

#sidebar-close svg,
#sidebar-search-toggle svg,
#sidebar-settings-btn svg,
#hamburger svg,
.sidebar-icon-btn svg,
.sidebar-new-btn svg,
.thread-menu-btn svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#conversation-section {
  flex: 1;
  padding: 6px 10px 14px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.sidebar-actions {
  display: grid;
  gap: 8px;
  padding: 0 10px 8px;
}

.sidebar-icon-btn,
.sidebar-new-btn,
.thread-menu-btn,
.sidebar-btn {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-main);
  color: var(--text-main);
  cursor: pointer;
  font: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.sidebar-new-btn {
  border: 0;
  background: transparent;
  min-height: 44px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 15px;
  font-weight: 600;
  text-align: left;
}

.sidebar-new-btn:hover,
.thread-item.active,
.thread-item:focus-within {
  background: var(--bg-main);
}

.sidebar-icon-btn {
  min-width: 40px;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-icon-btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #ffffff;
}

.sidebar-btn {
  font-size: 14px;
  min-height: 38px;
  padding: 8px 10px;
}

.sidebar-btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #ffffff;
}

#thread-search {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-main);
  color: var(--text-main);
  padding: 8px 12px;
  font-size: 14px;
}

#thread-search[hidden] {
  display: none;
}

#thread-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.sidebar-section-title {
  color: var(--text-main);
  font-size: 13px;
  font-weight: 750;
  padding: 14px 10px 6px;
}

#memory-log-status {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.4;
}

#memory-log-results {
  display: grid;
  gap: 8px;
  max-height: min(55vh, 520px);
  overflow-y: auto;
}

.memory-log-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-main);
  padding: 8px;
  display: grid;
  gap: 4px;
}

.memory-log-title {
  font-size: 12px;
  font-weight: 650;
}

.memory-log-preview {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.35;
}

.thread-item {
  border: 0;
  border-radius: 8px;
  background: transparent;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 36px;
  align-items: center;
  gap: 3px;
  padding: 3px;
}

.thread-item.active {
  background: var(--bg-user);
}

.thread-open-btn {
  border: 0;
  background: transparent;
  color: var(--text-main);
  cursor: pointer;
  display: grid;
  gap: 2px;
  min-width: 0;
  min-height: 42px;
  padding: 7px 8px;
  text-align: left;
}

.thread-title {
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.thread-meta {
  color: var(--text-dim);
  font-size: 11px;
}

.thread-menu-btn {
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  background: transparent;
}

#sidebar-footer {
  padding: 10px 14px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

/* Main chat area */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}

#header {
  position: relative;
  z-index: 20;
  background: var(--bg-chat);
  padding: 15px 20px;
  padding-top: calc(15px + env(safe-area-inset-top));
  padding-left: calc(20px + env(safe-area-inset-left));
  padding-right: calc(20px + env(safe-area-inset-right));
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

#hamburger {
  position: relative;
  z-index: 22;
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text-main);
  cursor: pointer;
  padding: 0;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

#title {
  font-size: 1.2em;
  font-weight: 600;
}

#header-controls {
  position: relative;
  z-index: 21;
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  position: relative;
  z-index: 22;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-main);
  transition: all 0.2s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.icon-btn:hover {
  border-color: var(--primary);
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  position: relative;
  padding: 12px 16px;
  border-radius: 12px;
  max-width: 85%;
  line-height: 1.5;
  word-wrap: break-word;
}

.message-content {
  white-space: pre-wrap;
}

.message-time {
  color: var(--text-dim);
  font-size: 11px;
  margin-top: 6px;
}

.message-actions {
  display: flex;
  gap: 4px;
  margin-top: 7px;
  opacity: 0.62;
}

.message.user .message-actions {
  justify-content: flex-end;
}

.message:hover .message-actions,
.message:focus-within .message-actions {
  opacity: 1;
}

.icon-action {
  width: 30px;
  height: 30px;
  min-width: 30px;
  min-height: 30px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.icon-action:hover,
.icon-action:focus-visible {
  background: var(--bg-main);
  color: var(--text-main);
  outline: none;
}

.icon-action.danger {
  color: var(--danger);
}

.icon-action svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.message.user {
  background: var(--bg-user);
  align-self: flex-end;
  margin-left: auto;
}

.message.assistant {
  background: var(--bg-assistant);
  align-self: flex-start;
  border: 1px solid var(--border);
}

#input-container {
  background: var(--bg-chat);
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  padding-left: calc(15px + env(safe-area-inset-left));
  padding-right: calc(15px + env(safe-area-inset-right));
  display: flex;
  gap: 6px;
  align-items: center;
}

#import-file,
#attachment-file {
  display: none;
}

#input {
  flex: 1;
  background: var(--bg-main);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  color: var(--text-main);
  font-size: 16px;
  resize: none;
  min-height: 44px;
  max-height: 150px;
  font-family: inherit;
}

#input:focus {
  outline: none;
  border-color: var(--primary);
}

#attach-btn,
#voice-btn,
#send-btn {
  width: 42px;
  height: 42px;
  min-width: 42px;
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-main);
  color: var(--text-main);
  font-size: 21px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

#attach-btn svg,
#voice-btn svg,
#send-btn svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#send-btn {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

#voice-btn.listening {
  background: var(--secondary);
}

#voice-btn:hover,
#attach-btn:hover,
#send-btn:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
  color: white;
}

#attach-btn:disabled,
#voice-btn:disabled,
#send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.typing-indicator {
  display: none;
  align-self: flex-start;
  padding: 12px 16px;
  background: var(--bg-assistant);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 85px;
}

.typing-indicator.active {
  display: block;
}

.typing-indicator span {
  height: 8px;
  width: 8px;
  background: var(--text-dim);
  border-radius: 50%;
  display: inline-block;
  margin: 0 2px;
  animation: typing 1.4s infinite;
}

.typing-indicator span:nth-child(2) {
  animation-delay: 0.2s;
}

.typing-indicator span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}

#auth-screen {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg-main);
}

#auth-screen.active {
  display: flex;
}

#auth-box {
  width: min(100%, 360px);
  background: var(--bg-chat);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 22px;
  display: grid;
  gap: 14px;
}

#auth-box h2 {
  font-size: 22px;
}

#auth-password {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-main);
  color: var(--text-main);
  padding: 12px;
  font-size: 16px;
}

#auth-submit {
  min-height: 44px;
  border: 0;
  border-radius: 8px;
  background: var(--primary);
  color: white;
  font-weight: 600;
  cursor: pointer;
}

#auth-error {
  min-height: 18px;
  color: var(--danger);
  font-size: 14px;
}

/* Theme picker modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 2000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: var(--bg-chat);
  border-radius: 12px;
  padding: 24px;
  max-width: 320px;
  width: 90%;
}

#message-action-sheet .modal,
#thread-action-sheet .modal,
#sidebar-settings-sheet .modal {
  width: min(86vw, 330px);
  padding: 8px;
  display: grid;
  gap: 0;
}

.sheet-action {
  min-height: 48px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  font-size: 18px;
  text-align: left;
}

.sheet-action:hover {
  background: var(--bg-main);
}

.sheet-action.danger {
  color: var(--danger);
}

.sheet-action svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.audio-player {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  color: var(--text-dim);
}

.audio-player[hidden] {
  display: none;
}

.audio-btn {
  width: 32px;
  height: 32px;
  min-width: 32px;
  min-height: 32px;
  border: 0;
  border-radius: 999px;
  background: var(--bg-main);
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}

.audio-btn svg {
  width: 17px;
  height: 17px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.audio-speed {
  min-height: 32px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-main);
  color: var(--text-main);
  padding: 0 8px;
  font-size: 13px;
}

.voice-form {
  display: grid;
  gap: 12px;
}

.voice-form label {
  display: grid;
  gap: 6px;
  font-size: 14px;
  color: var(--text-dim);
}

.voice-form select {
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-main);
  color: var(--text-main);
  padding: 8px 10px;
  font-size: 16px;
}

.voice-note {
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.4;
}

/* Mobile adjustments */
@media (max-width: 600px) {
  #sidebar {
    width: min(85%, 320px);
  }
  
  #messages {
    padding: 15px;
  }
  
  .message {
    max-width: 90%;
  }
  
  #input-container {
    padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    padding-left: calc(10px + env(safe-area-inset-left));
    padding-right: calc(10px + env(safe-area-inset-right));
  }

  #attach-btn,
  #voice-btn,
  #send-btn {
    width: 40px;
    height: 40px;
    min-width: 40px;
    min-height: 40px;
  }

  #header {
    padding-top: calc(12px + env(safe-area-inset-top));
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
  }
}
</style>
</head>
<body>

<div id="auth-screen">
  <form id="auth-box">
    <h2>Tatjana Portal</h2>
    <p>Bitte gib dein Portal-Passwort ein.</p>
    <input id="auth-password" type="password" autocomplete="current-password" placeholder="Passwort">
    <button id="auth-submit" type="submit">Entsperren</button>
    <div id="auth-error" aria-live="polite"></div>
  </form>
</div>

<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h3>Tatjana</h3>
      <div class="sidebar-header-actions">
        <button id="sidebar-search-toggle" type="button" aria-label="Gespraeche suchen" title="Gespraeche suchen"></button>
        <button id="sidebar-close" type="button" onclick="closeSidebar(event)" ontouchend="closeSidebar(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();closeSidebar(event)}" aria-label="Menue schliessen"></button>
      </div>
    </div>

    <div class="sidebar-actions">
      <button class="sidebar-new-btn" id="new-thread-btn" type="button" aria-label="Neuer Chat" title="Neuer Chat"><span>Neuer Chat</span></button>
      <input id="thread-search" type="search" placeholder="Suchen" aria-label="Gespraeche suchen" hidden>
      <input id="import-file" type="file" accept=".md,.txt,.json">
    </div>

    <div id="conversation-section">
      <div class="sidebar-section-title">Aktuelle</div>
      <div id="thread-list"></div>
    </div>

    <div id="sidebar-footer">
      <button id="sidebar-settings-btn" type="button" aria-label="Einstellungen" title="Einstellungen"></button>
    </div>
  </div>
  
  <!-- Main chat -->
  <div id="main">
    <div id="header">
      <div id="header-left">
        <button id="hamburger" type="button" aria-label="Gespraeche oeffnen" onclick="openSidebar(event)" ontouchend="openSidebar(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSidebar(event)}"></button>
        <div id="title">Tatjana</div>
      </div>
    </div>
    
    <div id="messages"></div>
    
    <div id="input-container">
      <button id="attach-btn" type="button" aria-label="Datei oder Bild hinzufuegen" title="Datei oder Bild hinzufuegen"></button>
      <textarea id="input" placeholder="Schreib mir..." rows="1" aria-label="Nachricht schreiben"></textarea>
      <button id="voice-btn" type="button" aria-label="Nachricht diktieren" title="Nachricht diktieren"></button>
      <button id="send-btn" type="button" aria-label="Nachricht senden" title="Nachricht senden"></button>
      <input id="attachment-file" type="file" accept="image/*,.pdf,.txt,.md,.json">
    </div>
  </div>
</div>

<div id="memory-modal" class="modal-overlay">
  <div class="modal">
    <h3>Memory Suche</h3>
    <div id="memory-log-status">Noch keine Suche in diesem Chat.</div>
    <div id="memory-log-results"></div>
    <button class="sidebar-btn primary" id="memory-modal-close" type="button">Schliessen</button>
  </div>
</div>

<div id="message-action-sheet" class="modal-overlay">
  <div class="modal">
    <button class="sheet-action" type="button" data-action="copy"></button>
    <button class="sheet-action" type="button" data-action="speak"></button>
    <button class="sheet-action danger" type="button" data-action="delete"></button>
  </div>
</div>

  currentMode = mode;
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(THREAD_STORE)) {
        const store = database.createObjectStore(THREAD_STORE, { keyPath: 'id' });
        store.createIndex('updatedAt', 'updatedAt');
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function id() {
  return crypto.randomUUID ? crypto.randomUUID() : `thread-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function requestStore(mode = 'readonly') {
  return db.transaction(THREAD_STORE, mode).objectStore(THREAD_STORE);
}

function getAllThreads() {
  return new Promise((resolve, reject) => {
    const request = requestStore().getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  });
}

function putThread(thread) {
  return new Promise((resolve, reject) => {
    const request = requestStore('readwrite').put(thread);
    request.onsuccess = () => resolve(thread);
    request.onerror = () => reject(request.error);
  });
}

function removeThread(idToDelete) {
  return new Promise((resolve, reject) => {
    const request = requestStore('readwrite').delete(idToDelete);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

function currentThread() {
  return threads.find(thread => thread.id === currentThreadId);
}

function createThread(title = 'Neues Gespraech', initialMessages = []) {
  const now = new Date().toISOString();
  return {
    id: id(),
    title,
    createdAt: now,
    updatedAt: now,
    messages: initialMessages.map(message => ({ ...message, timestamp: message.timestamp || now }))
  };
}

function formatTime(value) {
  if (!value) return '';
  return new Intl.DateTimeFormat('de-DE', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(value));
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderMessageMarkup(content) {
  return escapeHtml(content)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function renderThreadList() {
  threadList.innerHTML = '';
  const searchTerm = (threadSearch.value || '').trim().toLowerCase();
  const filtered = searchTerm
    ? threads.filter(thread => {
        const haystack = [
          thread.title || '',
          ...(thread.messages || []).map(message => message.content || '')
        ].join('\n').toLowerCase();
        return haystack.includes(searchTerm);
      })
    : threads;
  const sorted = [...filtered].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  sorted.forEach(thread => {
    const item = document.createElement('div');
    item.className = 'thread-item' + (thread.id === currentThreadId ? ' active' : '');
    item.innerHTML = `
      <button class="thread-open-btn" type="button" aria-label="Gespraech oeffnen">
        <span class="thread-title">${escapeHtml(thread.title || 'Unbenanntes Gespraech')}</span>
        <span class="thread-meta">${thread.messages.length} Nachrichten - ${formatTime(thread.updatedAt)}</span>
      </button>
      <button class="thread-menu-btn" type="button" aria-label="Optionen fuer dieses Gespraech" title="Optionen">${ICONS.dots}</button>
    `;
    item.querySelector('.thread-open-btn').addEventListener('click', () => switchThread(thread.id));
    item.querySelector('.thread-menu-btn').addEventListener('click', (event) => {
      event.stopPropagation();
      openThreadActionSheet(thread.id);
    });
    threadList.appendChild(item);
  });
}

function renderMessages() {
  messagesDiv.innerHTML = '';
  messages.forEach((msg, index) => {
    if (msg.role !== 'system') displayMessage(msg.role, msg.content, msg.timestamp, index);
  });
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function renderMemoryLog(log) {
  if (!log) return;
  memoryLogResults.innerHTML = '';
  if (!log.searched) {
    memoryLogStatus.textContent = 'Keine Memory Suche ausgelöst.';
    return;
  }

  const query = log.query ? `"${log.query}"` : 'ohne Suchtext';
  if (log.error) {
    memoryLogStatus.textContent = `Suche: ${query} - Fehler: ${log.error}`;
    return;
  }

  memoryLogStatus.textContent = `Suche: ${query} - ${log.resultCount || 0} Treffer`;
  (log.results || []).forEach(result => {
    const item = document.createElement('div');
    item.className = 'memory-log-item';
    item.innerHTML = `
      <div class="memory-log-title">${escapeHtml(result.date || '')} - ${escapeHtml(result.title || 'Unbenannter Chat')}</div>
      <div class="memory-log-preview">${escapeHtml(result.preview || '')}</div>
    `;
    memoryLogResults.appendChild(item);
  });
}

function displayMessage(role, content, timestamp = new Date().toISOString(), index = messages.length - 1) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.dataset.index = String(index);
  const message = messages[index] || {};
  const speakButton = role === 'assistant'
    ? `<button class="icon-action" type="button" data-action="speak" title="Vorlesen" aria-label="Vorlesen">${ICONS.speak}</button>`
    : '';
  const audioPlayer = role === 'assistant'
    ? `<div class="audio-player" data-audio-player="${index}" ${message.audioUrl ? '' : 'hidden'}>
        <button class="audio-btn" type="button" data-audio-action="rewind" title="5 Sekunden zurueck" aria-label="5 Sekunden zurueck">${ICONS.rewind}</button>
        <button class="audio-btn" type="button" data-audio-action="toggle" title="Abspielen oder pausieren" aria-label="Abspielen oder pausieren">${ICONS.play}</button>
        <button class="audio-btn" type="button" data-audio-action="forward" title="5 Sekunden vor" aria-label="5 Sekunden vor">${ICONS.forward}</button>
        <select class="audio-speed" data-audio-action="speed" aria-label="Tempo">
          <option value="0.9">0.9x</option>
          <option value="1" selected>1x</option>
          <option value="1.1">1.1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>`
    : '';
  div.innerHTML = `
    <div class="message-content">${renderMessageMarkup(content)}</div>
    <div class="message-time">${formatTime(timestamp)}</div>
    ${audioPlayer}
    <div class="message-actions">
      <button class="icon-action" type="button" data-action="copy" title="Kopieren" aria-label="Kopieren">${ICONS.copy}</button>
      ${speakButton}
      <button class="icon-action danger" type="button" data-action="delete" title="Loeschen" aria-label="Loeschen">${ICONS.trash}</button>
    </div>
  `;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTyping() {
  const typing = document.createElement('div');
  typing.className = 'typing-indicator active';
  typing.innerHTML = '<span></span><span></span><span></span>';
  messagesDiv.appendChild(typing);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return typing;
}

async function saveCurrentThread() {
  const thread = currentThread();
  if (!thread) return;
  thread.messages = messages;
  thread.updatedAt = new Date().toISOString();
  await putThread(thread);
  await refreshThreads();
}

async function refreshThreads() {
  threads = await getAllThreads();
  renderThreadList();
}

async function switchThread(threadId) {
  currentThreadId = threadId;
  localStorage.setItem(CURRENT_THREAD_KEY, currentThreadId);
  const thread = currentThread();
  messages = thread ? [...thread.messages] : [];
  renderMessages();
  renderThreadList();
  closeSidebar();
  input.focus();
}

async function newThread() {
  const thread = createThread();
  await putThread(thread);
  await refreshThreads();
  await switchThread(thread.id);
}

async function renameThread(threadId = currentThreadId) {
  const thread = threads.find(item => item.id === threadId);
  if (!thread) return;
  const title = prompt('Neuer Name fuer dieses Gespraech:', thread.title || 'Neues Gespraech');
  if (!title || !title.trim()) return;
  thread.title = title.trim();
  thread.updatedAt = new Date().toISOString();
  await putThread(thread);
  await refreshThreads();
}

async function deleteThread(threadId = currentThreadId) {
  const thread = threads.find(item => item.id === threadId);
  if (!thread) return;
  if (!confirm(`Gespraech "${thread.title}" wirklich loeschen?`)) return;
  await removeThread(thread.id);
  await refreshThreads();
  if (thread.id !== currentThreadId) {
    renderThreadList();
    return;
  }
  if (!threads.length) {
    await newThread();
    return;
  }
  await switchThread([...threads].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0].id);
}

async function clearAllThreads() {
  if (!confirm('Wirklich alle lokalen Gespraeche in diesem Portal loeschen?')) return;
  await Promise.all(threads.map(thread => removeThread(thread.id)));
  localStorage.removeItem('conversation');
  localStorage.removeItem(CURRENT_THREAD_KEY);
  localStorage.setItem('tatjana-localstorage-migrated', '1');
  threads = [];
  messages = [];
  currentThreadId = '';
  await newThread();
}

function threadToMarkdown(thread) {
  const lines = [`# ${thread.title || 'Gespraech'}`, '', `Exportiert: ${new Date().toLocaleString('de-DE')}`, ''];
  thread.messages.forEach(message => {
    const name = message.role === 'user' ? 'Moni' : 'Tatjana';
    lines.push(`## ${name} - ${formatTime(message.timestamp)}`, '', message.content || '', '');
  });
  return lines.join('\n');
}

function download(filename, content, type = 'text/plain') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportThread(threadId = currentThreadId) {
  const thread = threads.find(item => item.id === threadId);
  if (!thread) return;
  const safeTitle = (thread.title || 'tatjana-gespraech').replace(/[^a-z0-9**-]+/gi, '-').slice(0, 60);
  download(`${safeTitle}.md`, threadToMarkdown(thread), 'text/markdown');
}

async function importThreadFromFile(file) {
  const content = await file.text();
  let importedMessages = [];
  let title = file.name.replace(/\.(md|txt|json)$/i, '') || 'Importiertes Gespraech';

  if (file.name.toLowerCase().endsWith('.json')) {
    const parsed = JSON.parse(content);
    title = parsed.title || title;
    importedMessages = Array.isArray(parsed.messages) ? parsed.messages : [];
  } else {
    importedMessages = [{ role: 'user', content, timestamp: new Date().toISOString() }];
  }

  const thread = createThread(title, importedMessages.filter(message => message.role === 'user' || message.role === 'assistant'));
  await putThread(thread);
  await refreshThreads();
  await switchThread(thread.id);
}

async function copyMessage(index) {
  const message = messages[index];
  if (!message) return;
  await navigator.clipboard.writeText(message.content || '');
}

async function deleteMessage(index) {
  const message = messages[index];
  if (!message) return;
  if (!confirm('Diese Nachricht wirklich loeschen?')) return;
  messages.splice(index, 1);
  renderMessages();
  await saveCurrentThread();
}

function audioUrlFromBase64(base64, contentType = 'audio/mpeg') {
  return `data:${contentType};base64,${base64}`;
}

async function createOpenAiAudio(index) {
  const message = messages[index];
  if (!message?.content) return '';
  const response = await fetch('/.netlify/functions/openai-tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({
      text: message.content,
      voice: voiceSelect.value || 'coral'
    })
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    if (response.status === 401 && data.type === 'portal_auth_required') {
      localStorage.removeItem(PORTAL_AUTH_KEY);
      portalAuthToken = '';
      authScreen.classList.add('active');
      authPassword.focus();
    }
    throw new Error(data.error || 'Audio konnte nicht erzeugt werden.');
  }
  if (!data.audioBase64) throw new Error('Leere Audioantwort erhalten.');
  message.audioUrl = audioUrlFromBase64(data.audioBase64, data.contentType);
  message.audioVoice = data.voice || voiceSelect.value || 'coral';
  message.audioCreatedAt = new Date().toISOString();
  await saveCurrentThread();
  renderMessages();
  return message.audioUrl;
}

function getAudioPlayer(index) {
  return messagesDiv.querySelector(`[data-audio-player="${index}"]`);
}

function setAudioButtonIcon(button, isPlaying) {
  if (!button) return;
  button.innerHTML = isPlaying ? ICONS.pause : ICONS.play;
}

async function speakMessage(index) {
  const message = messages[index];
  if (!message) return;
  const audioUrl = message.audioUrl || await createOpenAiAudio(index);
  if (!audioUrl) return;
  const player = getAudioPlayer(index);
  if (player) player.hidden = false;
  await playAudio(index);
}

async function playAudio(index) {
  const message = messages[index];
  if (!message?.audioUrl) return;
  const player = getAudioPlayer(index);
  const toggleButton = player?.querySelector('[data-audio-action="toggle"]');
  const speedSelect = player?.querySelector('[data-audio-action="speed"]');

  if (currentAudio && currentAudio.dataset.index === String(index)) {
    if (currentAudio.paused) {
      currentAudio.playbackRate = Number(speedSelect?.value || 1);
      await currentAudio.play();
      setAudioButtonIcon(toggleButton, true);
    } else {
      currentAudio.pause();
      setAudioButtonIcon(toggleButton, false);
    }
    return;
  }

  if (currentAudio) {
    currentAudio.pause();
    setAudioButtonIcon(currentAudioButton, false);
  }

  currentAudio = new Audio(message.audioUrl);
  currentAudio.dataset.index = String(index);
  currentAudio.playbackRate = Number(speedSelect?.value || 1);
  currentAudioButton = toggleButton;
  currentAudio.addEventListener('ended', () => setAudioButtonIcon(toggleButton, false));
  await currentAudio.play();
  setAudioButtonIcon(toggleButton, true);
}

function seekAudio(seconds) {
  if (!currentAudio) return;
  currentAudio.currentTime = Math.max(0, Math.min(currentAudio.duration || 0, currentAudio.currentTime + seconds));
}

function setAudioSpeed(rate) {
  if (!currentAudio) return;
  currentAudio.playbackRate = Number(rate || 1);
}

function openMessageActionSheet(index) {
  if (!messages[index]) return;
  actionSheetMessageIndex = index;
  const speakAction = messageActionSheet.querySelector('[data-action="speak"]');
  speakAction.style.display = messages[index].role === 'assistant' ? 'flex' : 'none';
  messageActionSheet.classList.add('active');
}

function closeMessageActionSheet() {
  messageActionSheet.classList.remove('active');
  actionSheetMessageIndex = null;
}

function openThreadActionSheet(threadId) {
  if (!threads.some(thread => thread.id === threadId)) return;
  actionSheetThreadId = threadId;
  threadActionSheet.classList.add('active');
}

function closeThreadActionSheet() {
  threadActionSheet.classList.remove('active');
  actionSheetThreadId = null;
}

function closeSidebarSettings() {
  sidebarSettingsSheet.classList.remove('active');
}

function toggleThreadSearch() {
  const isHidden = threadSearch.hasAttribute('hidden');
  if (isHidden) {
    threadSearch.removeAttribute('hidden');
    threadSearch.focus();
    return;
  }
  threadSearch.value = '';
  threadSearch.setAttribute('hidden', '');
  renderThreadList();
}

function clearLongPressTimer() {
  if (!longPressTimer) return;
  clearTimeout(longPressTimer);
  longPressTimer = null;
}

async function runMessageAction(action, index) {
  if (!Number.isInteger(index)) return;
  if (action === 'copy') await copyMessage(index);
  if (action === 'delete') await deleteMessage(index);
  if (action === 'speak') await speakMessage(index);
}

async function runThreadAction(action, threadId) {
  if (!threadId) return;
  if (action === 'open') await switchThread(threadId);
  if (action === 'rename') await renameThread(threadId);
  if (action === 'export') exportThread(threadId);
  if (action === 'delete') await deleteThread(threadId);
}

function handleAttachmentPlaceholder() {
  alert('Bild- und Datei-Upload bauen wir als naechsten Schritt richtig ein. Der Platzhalter ist jetzt schon da.');
}

function setupSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    voiceBtn.disabled = true;
    voiceBtn.title = 'Diktieren wird von diesem Browser nicht unterstuetzt';
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'de-DE';
  recognition.interimResults = true;
  recognition.continuous = false;

  let baseText = '';
  recognition.onstart = () => {
    isListening = true;
    baseText = input.value.trim();
    voiceBtn.classList.add('listening');
    voiceBtn.innerHTML = ICONS.stop;
  };

  recognition.onresult = (event) => {
    const transcript = Array.from(event.results)
      .map(result => result[0].transcript)
      .join('');
    input.value = [baseText, transcript].filter(Boolean).join(' ');
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  };

  recognition.onend = () => {
    isListening = false;
    voiceBtn.classList.remove('listening');
    voiceBtn.innerHTML = ICONS.mic;
  };

  recognition.onerror = () => {
    isListening = false;
    voiceBtn.classList.remove('listening');
    voiceBtn.innerHTML = ICONS.mic;
  };
}

function toggleSpeechRecognition() {
  if (!recognition) {
    alert('Diktieren wird von diesem Browser leider nicht unterstuetzt.');
    return;
  }
  if (isListening) {
    recognition.stop();
    return;
  }
  recognition.start();
}

async function initAuth() {
  const response = await fetch('/.netlify/functions/auth-status');
  const data = await response.json().catch(() => ({ enabled: false }));
  if (!data.enabled) {
    authScreen.classList.remove('active');
    return;
  }

  if (portalAuthToken) {
    authScreen.classList.remove('active');
    return;
  }

  authScreen.classList.add('active');
  authPassword.focus();
  await new Promise((resolve) => {
    authBox.addEventListener('submit', async (event) => {
      event.preventDefault();
      authError.textContent = '';
      const password = authPassword.value;
      try {
        const loginResponse = await fetch('/.netlify/functions/auth-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const loginData = await loginResponse.json().catch(() => ({}));
        if (!loginResponse.ok || !loginData.token) {
          authError.textContent = 'Das Passwort stimmt leider nicht.';
          return;
        }
        portalAuthToken = loginData.token;
        localStorage.setItem(PORTAL_AUTH_KEY, portalAuthToken);
        authPassword.value = '';
        authScreen.classList.remove('active');
        resolve();
      } catch (error) {
        authError.textContent = 'Anmeldung fehlgeschlagen. Bitte versuch es nochmal.';
      }
    }, { once: false });
  });
}

function authHeaders() {
  return portalAuthToken ? { 'X-Portal-Auth': portalAuthToken } : {};
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  input.disabled = true;
  sendBtn.disabled = true;

  const userMessage = { role: 'user', content: text, timestamp: new Date().toISOString() };
  messages.push(userMessage);
  displayMessage('user', text, userMessage.timestamp, messages.length - 1);
  await saveCurrentThread();

  input.value = '';
  input.style.height = 'auto';
  const typing = showTyping();

  try {
    const apiMessages = [
      { role: 'system', content: `${SYSTEM_PROMPT}\n\n${CORE_MEMORY}` },
      ...messages.slice(-10).map(({ role, content }) => ({ role, content }))
    ];

    const response = await fetch('/.netlify/functions/openai-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ messages: apiMessages, model: 'gpt-4o' })
    });

    const data = await response.json().catch(() => ({}));
    renderMemoryLog(data.memoryLog);
    if (!response.ok) {
      if (response.status === 401 && data.type === 'portal_auth_required') {
        localStorage.removeItem(PORTAL_AUTH_KEY);
        portalAuthToken = '';
        authScreen.classList.add('active');
        authPassword.focus();
        throw new Error('Bitte entsperre das Portal erneut.');
      }
      throw new Error(data.error || `API-Fehler: ${response.status}`);
    }
    if (data.error) throw new Error(data.error);

    const assistantMessage = data.choices?.[0]?.message?.content;
    if (!assistantMessage) throw new Error('Leere Antwort erhalten.');

    typing.remove();
    const reply = { role: 'assistant', content: assistantMessage, timestamp: new Date().toISOString() };
    messages.push(reply);
    displayMessage('assistant', assistantMessage, reply.timestamp, messages.length - 1);
    await saveCurrentThread();
  } catch (error) {
    typing.remove();
    console.error('Fehler:', error);
    displayMessage('assistant', 'Entschuldige, da ist etwas schiefgelaufen. Bitte versuch es nochmal.', new Date().toISOString(), messages.length);
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

async function init() {
  db = await openDatabase();
  localStorage.setItem('tatjana-localstorage-migrated', '1');
  threads = await getAllThreads();
  if (!threads.length) {
    const thread = createThread();
    await putThread(thread);
    threads = await getAllThreads();
    currentThreadId = thread.id;
    localStorage.setItem(CURRENT_THREAD_KEY, currentThreadId);
  }
  if (!threads.some(thread => thread.id === currentThreadId)) {
    currentThreadId = [...threads].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0].id;
    localStorage.setItem(CURRENT_THREAD_KEY, currentThreadId);
  }
  const thread = currentThread();
  messages = thread ? [...thread.messages] : [];
  renderThreadList();
  renderMessages();
  input.focus();
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);
voiceBtn.addEventListener('click', toggleSpeechRecognition);
attachBtn.addEventListener('click', handleAttachmentPlaceholder);
newThreadBtn.addEventListener('click', newThread);
clearAllBtn.addEventListener('click', async () => {
  closeSidebarSettings();
  await clearAllThreads();
});
exportThreadBtn.addEventListener('click', () => {
  closeSidebarSettings();
  exportThread(currentThreadId);
});
importThreadBtn.addEventListener('click', () => {
  closeSidebarSettings();
  importFile.click();
});
memoryLogBtn.addEventListener('click', () => {
  closeSidebarSettings();
  memoryModal.classList.add('active');
});
voiceSettingsBtn.addEventListener('click', () => {
  closeSidebarSettings();
  voiceModal.classList.add('active');
});
voiceModalClose.addEventListener('click', () => voiceModal.classList.remove('active'));
voiceModal.addEventListener('click', (event) => {
  if (event.target === voiceModal) voiceModal.classList.remove('active');
});
voiceSelect.addEventListener('change', () => {
  localStorage.setItem(TTS_VOICE_KEY, voiceSelect.value);
});
sidebarSettingsBtn.addEventListener('click', () => sidebarSettingsSheet.classList.add('active'));
sidebarSearchToggle.addEventListener('click', toggleThreadSearch);
memoryModalClose.addEventListener('click', () => memoryModal.classList.remove('active'));
memoryModal.addEventListener('click', (event) => {
  if (event.target === memoryModal) memoryModal.classList.remove('active');
});
sidebarSettingsSheet.addEventListener('click', (event) => {
  if (event.target === sidebarSettingsSheet) closeSidebarSettings();
});
messageActionSheet.addEventListener('click', async (event) => {
  if (event.target === messageActionSheet) {
    closeMessageActionSheet();
    return;
  }
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const index = actionSheetMessageIndex;
  closeMessageActionSheet();
  await runMessageAction(button.dataset.action, index);
});
threadActionSheet.addEventListener('click', async (event) => {
  if (event.target === threadActionSheet) {
    closeThreadActionSheet();
    return;
  }
  const button = event.target.closest('[data-thread-action]');
  if (!button) return;
  const threadId = actionSheetThreadId;
  closeThreadActionSheet();
  await runThreadAction(button.dataset.threadAction, threadId);
});
threadSearch.addEventListener('input', renderThreadList);
importFile.addEventListener('change', async () => {
  const [file] = importFile.files;
  if (file) await importThreadFromFile(file);
  importFile.value = '';
});

messagesDiv.addEventListener('click', async (event) => {
  const audioControl = event.target.closest('[data-audio-action]');
  if (audioControl) {
    const wrapper = audioControl.closest('.message');
    const index = Number(wrapper?.dataset.index);
    if (!Number.isInteger(index)) return;
    const action = audioControl.dataset.audioAction;
    if (action === 'toggle') await playAudio(index);
    if (action === 'rewind') seekAudio(-5);
    if (action === 'forward') seekAudio(5);
    return;
  }
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const wrapper = button.closest('.message');
  const index = Number(wrapper?.dataset.index);
  await runMessageAction(button.dataset.action, index);
});

messagesDiv.addEventListener('change', (event) => {
  const speedSelect = event.target.closest('[data-audio-action="speed"]');
  if (!speedSelect) return;
  setAudioSpeed(speedSelect.value);
});

messagesDiv.addEventListener('touchstart', (event) => {
  const wrapper = event.target.closest('.message');
  if (!wrapper || event.target.closest('[data-action]') || event.target.closest('[data-audio-action]')) return;
  const index = Number(wrapper.dataset.index);
  if (!Number.isInteger(index)) return;
  clearLongPressTimer();
  longPressTimer = setTimeout(() => {
    openMessageActionSheet(index);
    longPressTimer = null;
  }, 520);
}, { passive: true });

messagesDiv.addEventListener('touchend', clearLongPressTimer, { passive: true });
messagesDiv.addEventListener('touchmove', clearLongPressTimer, { passive: true });
messagesDiv.addEventListener('contextmenu', (event) => {
  const wrapper = event.target.closest('.message');
  if (!wrapper) return;
  event.preventDefault();
  openMessageActionSheet(Number(wrapper.dataset.index));
});

setupSpeechRecognition();
initAuth().then(init).catch(error => {
  console.error('Initialisierung fehlgeschlagen:', error);
  messagesDiv.textContent = 'Fehler beim Laden des lokalen Speichers.';
});
</script>
