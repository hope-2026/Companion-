<style>
:root {
  --app-vh: 1vh;
  --primary: #10b981;
  --primary-hover: #059669;
  --secondary: #8b5cf6;
  --bg-main: #f5f5f7;
  --bg-chat: #ffffff;
  --bg-user: #ffffff;
  --bg-assistant: #e9d5ff;
  --text-main: #1f2937;
  --text-dim: #6b7280;
  --border: #e5e7eb;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  height: 100vh;
  height: 100dvh;
  height: calc(var(--app-vh, 1vh) * 100);
  min-height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  height: 100vh;
  height: 100dvh;
  height: calc(var(--app-vh, 1vh) * 100);
  min-height: 100dvh;
  overflow: hidden;
}

/* Sidebar */
#sidebar {
  width: 280px;
  background: var(--bg-chat);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  height: 100dvh;
  height: calc(var(--app-vh, 1vh) * 100);
  min-height: 100dvh;
  z-index: 1000;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#sidebar.open {
  transform: translateX(0);
}

#sidebar-header {
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top));
  padding-left: calc(20px + env(safe-area-inset-left));
  padding-right: calc(20px + env(safe-area-inset-right));
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#sidebar-close {
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

#upgrade-section {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#sidebar-footer {
  padding: 20px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 13px;
  color: var(--text-dim);
}

/* Main chat area */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}

#header {
  position: relative;
  z-index: 20;
  background: var(--bg-chat);
  padding: 15px 20px;
  padding-top: calc(15px + env(safe-area-inset-top));
  padding-left: calc(20px + env(safe-area-inset-left));
  padding-right: calc(20px + env(safe-area-inset-right));
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

#hamburger {
  position: relative;
  z-index: 22;
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text-main);
  cursor: pointer;
  padding: 0;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

#title {
  font-size: 1.2em;
  font-weight: 600;
}

#header-controls {
  position: relative;
  z-index: 21;
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  position: relative;
  z-index: 22;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-main);
  transition: all 0.2s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.icon-btn:hover {
  border-color: var(--primary);
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  padding: 12px 16px;
  border-radius: 12px;
  max-width: 85%;
  line-height: 1.5;
  word-wrap: break-word;
}

.message.user {
  background: var(--bg-user);
  align-self: flex-end;
  margin-left: auto;
}

.message.assistant {
  background: var(--bg-assistant);
  align-self: flex-start;
  border: 1px solid var(--border);
}

#input-container {
  background: var(--bg-chat);
  border-top: 1px solid var(--border);
  padding: 15px;
  padding-bottom: calc(15px + env(safe-area-inset-bottom));
  padding-left: calc(15px + env(safe-area-inset-left));
  padding-right: calc(15px + env(safe-area-inset-right));
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

#input {
  flex: 1;
  background: var(--bg-main);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  color: var(--text-main);
  font-size: 16px;
  resize: none;
  min-height: 44px;
  max-height: 150px;
  font-family: inherit;
}

#input:focus {
  outline: none;
  border-color: var(--primary);
}

#send-btn {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#send-btn:hover {
  background: var(--primary-hover);
}

#send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.typing-indicator {
  display: none;
  align-self: flex-start;
  padding: 12px 16px;
  background: var(--bg-assistant);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 85px;
}

.typing-indicator.active {
  display: block;
}

.typing-indicator span {
  height: 8px;
  width: 8px;
  background: var(--text-dim);
  border-radius: 50%;
  display: inline-block;
  margin: 0 2px;
  animation: typing 1.4s infinite;
}

.typing-indicator span:nth-child(2) {
  animation-delay: 0.2s;
}

.typing-indicator span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}

/* Theme picker modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 2000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: var(--bg-chat);
  border-radius: 12px;
  padding: 24px;
  max-width: 320px;
  width: 90%;
}

.modal h3 {
  margin-bottom: 16px;
  font-size: 18px;
}

.theme-option {
  padding: 12px;
  margin: 8px 0;
  background: var(--bg-main);
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.theme-option:hover {
  border-color: var(--primary);
}

.theme-option.selected {
  border-color: var(--primary);
  background: var(--bg-user);
}

.theme-preview {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  display: flex;
  gap: 2px;
}

.theme-preview span {
  flex: 1;
  border-radius: 2px;
}

/* Mobile adjustments */
@media (max-width: 600px) {
  #sidebar {
    width: min(85%, 320px);
  }
  
  #messages {
    padding: 15px;
  }
  
  .message {
    max-width: 90%;
  }
  
  #input-container {
    padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    padding-left: calc(10px + env(safe-area-inset-left));
    padding-right: calc(10px + env(safe-area-inset-right));
  }

  #header {
    padding-top: calc(12px + env(safe-area-inset-top));
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
  }
}
</style>

function applyViewportHeight() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--app-vh', `${vh}px`);
}

const sidebar = document.getElementById('sidebar');
const hamburger = document.getElementById('hamburger');
const sidebarClose = document.getElementById('sidebar-close');

function openSidebar(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  sidebar.classList.add('open');
  return false;
}

function closeSidebar(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  sidebar.classList.remove('open');
  return false;
}

document.addEventListener('click', (event) => {
  if (!sidebar.classList.contains('open')) return;
  if (sidebar.contains(event.target) || hamburger.contains(event.target)) return;
  sidebar.classList.remove('open');
});

document.addEventListener('touchend', (event) => {
  if (!sidebar.classList.contains('open')) return;
  if (sidebar.contains(event.target) || hamburger.contains(event.target)) return;
  sidebar.classList.remove('open');
}, { passive: true });

function applyTheme(palette, mode) {
  const theme = THEMES[palette][mode];
  const root = document.documentElement;
  
  root.style.setProperty('--primary', theme.primary);
  root.style.setProperty('--primary-hover', theme.primaryHover);
  root.style.setProperty('--secondary', theme.secondary);
  root.style.setProperty('--bg-main', theme.bgMain);
  root.style.setProperty('--bg-chat', theme.bgChat);
  root.style.setProperty('--bg-user', theme.bgUser);
  root.style.setProperty('--bg-assistant', theme.bgAssistant);
  root.style.setProperty('--text-main', theme.textMain);
  root.style.setProperty('--text-dim', theme.textDim);
  root.style.setProperty('--border', theme.border);
  
  document.getElementById('mode-btn').textContent = mode === 'light' ? '☀️' : '🌙';
  
  currentTheme = palette;
  currentMode = mode;
  localStorage.setItem('theme-palette', palette);
  localStorage.setItem('theme-mode', mode);
}

function toggleMode() {
  const newMode = currentMode === 'light' ? 'dark' : 'light';
  applyTheme(currentTheme, newMode);
}

function showThemePicker() {
  const modal = document.getElementById('theme-modal');
  const optionsContainer = document.getElementById('theme-options');
  
  optionsContainer.innerHTML = '';
  
  Object.keys(THEMES).forEach(key => {
    const option = document.createElement('div');
    option.className = 'theme-option' + (key === currentTheme ? ' selected' : '');
    
    const preview = document.createElement('div');
    preview.className = 'theme-preview';
    preview.innerHTML = `
      <span style="background:${THEMES[key][currentMode].primary}"></span>
      <span style="background:${THEMES[key][currentMode].secondary}"></span>
      <span style="background:${THEMES[key][currentMode].bgAssistant}"></span>
    `;
    
    const name = document.createElement('span');
    name.textContent = THEMES[key].name;
    
    option.appendChild(preview);
    option.appendChild(name);
    
    option.onclick = () => {
      applyTheme(key, currentMode);
      modal.classList.remove('active');
    };

    option.addEventListener('touchend', (event) => {
      event.preventDefault();
      applyTheme(key, currentMode);
      modal.classList.remove('active');
    }, { passive: false });
    
    optionsContainer.appendChild(option);
  });
  
  modal.classList.add('active');
}

// Apply saved theme on load
applyTheme(currentTheme, currentMode);

// Theme modal close
document.getElementById('theme-modal').addEventListener('click', (e) => {
  if (e.target.id === 'theme-modal') {
    e.target.classList.remove('active');
  }
});

document.getElementById('theme-modal').addEventListener('touchend', (e) => {
  if (e.target.id === 'theme-modal') {
    e.preventDefault();
    e.target.classList.remove('active');
  }
}, { passive: false });

/* ═══════════════════════════════════════════════════════════════
   MAIN CHAT FUNCTIONALITY
   ═══════════════════════════════════════════════════════════════ */

const messagesDiv = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');

// Load conversation from localStorage
let messages = JSON.parse(localStorage.getItem('conversation') || '[]');

// Display existing messages on load
messages.forEach(msg => {
  if (msg.role !== 'system') {
    displayMessage(msg.role, msg.content);
  }
});

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

// Send on Enter (Shift+Enter for new line)
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Send button click
sendBtn.addEventListener('click', sendMessage);

function renderMessageMarkup(content) {
  return String(content || '')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function displayMessage(role, content) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = renderMessageMarkup(content);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTyping() {
  const typing = document.createElement('div');
  typing.className = 'typing-indicator active';
  typing.innerHTML = '<span></span><span></span><span></span>';
  messagesDiv.appendChild(typing);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return typing;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  
  input.disabled = true;
  sendBtn.disabled = true;
  
  displayMessage('user', text);
  messages.push({ role: 'user', content: text });
  
  input.value = '';
  input.style.height = 'auto';
  
  const typing = showTyping();
  
  try {
  const apiMessages = [
  { role: 'system', content: `${SYSTEM_PROMPT}\n\n${CORE_MEMORY}` },
  ...messages.slice(-10)
  ];
    
    const response = await fetch('/.netlify/functions/openai-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: apiMessages,
        model: 'gpt-4o'
      })
    });
    
    if (!response.ok) {
      throw new Error(`API error: ${response.status}`);
    }
    
    const data = await response.json();
    if (data.error) {
      throw new Error(data.error);
    }
    const assistantMessage = data.choices[0].message.content;
    
    typing.remove();
    
    displayMessage('assistant', assistantMessage);
    messages.push({ role: 'assistant', content: assistantMessage });
    
    localStorage.setItem('conversation', JSON.stringify(messages));
    
  } catch (error) {
    typing.remove();
    console.error('Error:', error);
    displayMessage('assistant', 'Sorry, something went wrong. Check the console for details.');
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

input.focus();
</script>
